<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Auth Callback</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --border: #e5e3df; --fg: #1c1b1a; --muted: #6b6963;
    --accent: #fe2c55; --code-bg: #f3f2ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312; --surface: #1d1c1a; --border: #322f2b; --fg: #f3f1ed; --muted: #a39e96;
      --accent: #fe2c55; --code-bg: #262420;
    }
  }
  body {
    background: var(--bg); color: var(--fg); margin: 0; padding-inline: 16px; padding-block: 48px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 480px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 8px; }
  .value {
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; word-break: break-all;
    background: var(--code-bg); border-radius: 8px; padding: 12px; min-height: 20px;
  }
  button {
    margin-top: 12px; width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: var(--accent); color: white; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
<main>
  <h1>TikTok authorization received</h1>
  <p class="sub">Copy the code below and hand it to whoever is completing the token exchange. It expires quickly.</p>

  <div class="card">
    <div class="label">Authorization code</div>
    <div class="value" id="code">—</div>
    <button id="copyCode" hidden>Copy code</button>
  </div>

  <div class="card">
    <div class="label">State</div>
    <div class="value" id="state">—</div>
  </div>

  <div class="card" id="errorCard" hidden>
    <div class="label">Error</div>
    <div class="value" id="error">—</div>
  </div>
</main>
<script>
  try {
    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error") || params.get("error_description");

    document.getElementById("code").textContent = code || "(none in URL)";
    document.getElementById("state").textContent = state || "(none)";

    if (error) {
      document.getElementById("errorCard").hidden = false;
      document.getElementById("error").textContent = error;
    }

    if (code) {
      const btn = document.getElementById("copyCode");
      btn.hidden = false;
      btn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = "Copied";
          setTimeout(() => (btn.textContent = "Copy code"), 1500);
        } catch {
          btn.textContent = "Select the code above manually";
        }
      });
    }
  } catch (e) {
    document.getElementById("code").textContent = "Error reading URL";
  }
</script>
</body>
</html>
